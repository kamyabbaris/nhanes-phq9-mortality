<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Participant flow diagram</title>
<desc>Exclusion cascade from 42,022 linkage-eligible NHANES participants to the final analytic sample of 26,333 with 2,460 deaths.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="20" width="300" height="60" rx="6" fill="#EEF2F6" stroke="#94A3B8" stroke-width="1"/>
<text x="190" y="44" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2937">Linkage-eligible NHANES participants</text>
<text x="190" y="64" text-anchor="middle" font-size="13" fill="#475569">2005–2018, ELIGSTAT = 1&#160;&#160;·&#160;&#160;n = 42,022</text>

<line x1="190" y1="80" x2="190" y2="120" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="190" y1="100" x2="398" y2="100" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="400" y="78" width="240" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="414" y="96" font-size="13" fill="#475569">Excluded: aged 18–19</text>
<text x="414" y="113" font-size="13" font-weight="500" fill="#1F2937">n = 2,390</text>

<rect x="40" y="120" width="300" height="60" rx="6" fill="#EEF2F6" stroke="#94A3B8" stroke-width="1"/>
<text x="190" y="144" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2937">Aged 20 years or older</text>
<text x="190" y="164" text-anchor="middle" font-size="13" fill="#475569">n = 39,632</text>

<line x1="190" y1="180" x2="190" y2="220" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="190" y1="200" x2="398" y2="200" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="400" y="178" width="240" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="414" y="196" font-size="13" fill="#475569">Excluded: no MEC exam</text>
<text x="414" y="213" font-size="13" font-weight="500" fill="#1F2937">n = 1,539</text>

<rect x="40" y="220" width="300" height="60" rx="6" fill="#EEF2F6" stroke="#94A3B8" stroke-width="1"/>
<text x="190" y="244" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2937">Attended MEC examination</text>
<text x="190" y="264" text-anchor="middle" font-size="13" fill="#475569">non-zero exam weight&#160;&#160;·&#160;&#160;n = 38,093</text>

<line x1="190" y1="280" x2="190" y2="320" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="190" y1="300" x2="398" y2="300" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="400" y="278" width="240" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="414" y="296" font-size="13" fill="#475569">Excluded: incomplete PHQ-9</text>
<text x="414" y="313" font-size="13" font-weight="500" fill="#1F2937">n = 4,029</text>

<rect x="40" y="320" width="300" height="60" rx="6" fill="#EEF2F6" stroke="#94A3B8" stroke-width="1"/>
<text x="190" y="344" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2937">Complete PHQ-9 (all nine items)</text>
<text x="190" y="364" text-anchor="middle" font-size="13" fill="#475569">n = 34,064</text>

<line x1="190" y1="380" x2="190" y2="420" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="190" y1="400" x2="398" y2="400" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="400" y="378" width="240" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="414" y="396" font-size="13" fill="#475569">Excluded: missing covariate</text>
<text x="414" y="413" font-size="13" font-weight="500" fill="#1F2937">n = 7,731</text>

<rect x="40" y="420" width="300" height="64" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
<text x="190" y="444" text-anchor="middle" font-size="14" font-weight="500" fill="#1E3A5F">Analytic sample</text>
<text x="190" y="464" text-anchor="middle" font-size="13" fill="#1E40AF">n = 26,333&#160;&#160;·&#160;&#160;2,460 deaths</text>

<text x="414" y="452" font-size="12" fill="#64748B">Largest single exclusion:</text>
<text x="414" y="469" font-size="12" fill="#64748B">BMI (n = 4,613) and income (n = 2,849)</text>
</svg>
